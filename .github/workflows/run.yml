name: Auto Active

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'Số tài khoản (1-20)'
        required: true
        default: '1'
      action:
        description: 'on hoặc off'
        required: true
        default: 'on'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Determine account and action
        run: |
          echo "ACCOUNT=${{ inputs.account }}" >> $GITHUB_ENV
          echo "ACTION=${{ inputs.action }}" >> $GITHUB_ENV

      - name: Select credentials
        run: |
          ACCOUNT="${{ inputs.account }}"
          if [ "$ACCOUNT" = "1" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_1 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_1 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "2" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_2 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_2 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "3" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_3 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_3 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "4" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_4 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_4 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "5" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_5 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_5 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "6" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_6 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_6 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "7" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_7 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_7 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "8" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_8 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_8 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "9" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_9 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_9 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "10" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_10 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_10 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "11" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_11 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_11 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "12" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_12 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_12 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "13" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_13 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_13 }}" >> $GITHUB_ENV
