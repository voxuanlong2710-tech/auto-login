            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_15 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "16" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_16 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_16 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "17" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_17 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_17 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "18" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_18 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_18 }}" >> $GITHUB_ENV
          elif [ "$ACCOUNT" = "19" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_19 }}" >> $GITHUB_ENV
