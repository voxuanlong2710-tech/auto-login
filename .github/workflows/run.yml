          elif [ "$ACCOUNT" = "20" ]; then
            echo "USERNAME_2PINK=${{ secrets.USERNAME_2PINK_20 }}" >> $GITHUB_ENV
            echo "PASSWORD_2PINK=${{ secrets.PASSWORD_2PINK_20 }}" >> $GITHUB_ENV
          fi

      - name: Run script
        env:
          USERNAME_2PINK: ${{ env.USERNAME_2PINK }}
          PASSWORD_2PINK: ${{ env.PASSWORD_2PINK }}
          ACTION: ${{ env.ACTION }}
          ACCOUNT: ${{ env.ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python auto_login.py
